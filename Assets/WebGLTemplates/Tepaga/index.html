<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="google-adsense-account" content="ca-pub-4309572988121078">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>TEPAGA!</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #151a24; }
      /* O'yin oynasi brauzer oynasini to'liq egallaydi. */
      #unity-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; font-family: sans-serif; color: #fff; }
      #title { font-size: 48px; font-weight: bold; color: #f28c2b; }
      #bar { width: min(320px, 70vw); height: 10px; border-radius: 5px; background: #323a4d; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #f28c2b; }
      #message { max-width: 80vw; text-align: center; font-variant-numeric: tabular-nums; }
      /* Matn paydo bo'lganda ustidagi chiziq sakramasligi uchun joy oldindan band qilinadi. */
      #hint { max-width: min(360px, 80vw); min-height: 3em; text-align: center; font-size: 14px; line-height: 1.5; opacity: 0.7; }
      #fullscreen { position: fixed; right: 12px; bottom: 12px; display: none; padding: 8px 12px; border: 0; border-radius: 6px; background: rgba(21, 26, 36, 0.65); color: #fff; font: 14px sans-serif; cursor: pointer; }
      #privacy { position: fixed; right: 112px; bottom: 20px; color: #fff; opacity: 0.7; font: 12px sans-serif; text-shadow: 0 1px 2px #000; }
      /* Yon bannerlar. Balandlik oynaga, eni 160x600 nisbatiga moslashadi. */
      .ad { position: fixed; top: 21vh; height: min(61vh, 41vw); aspect-ratio: 160 / 600; display: none; align-items: center; justify-content: center; overflow: hidden; border-radius: 8px; background: rgba(21, 26, 36, 0.6); border: 1px solid rgba(255, 255, 255, 0.25); color: #fff; font: bold clamp(10px, 1.3vw, 18px) sans-serif; text-align: center; text-decoration: none; user-select: none; pointer-events: none; }
      .ad img { width: 100%; height: 100%; object-fit: contain; }
      #ad-left { left: 2.5vw; }
      #ad-right { right: 2.5vw; }
      .ads-on .ad { display: flex; }
      .ads-clickable .ad[href] { pointer-events: auto; cursor: pointer; }
      /* Telefonda pastki qismni boshqaruv tugmalari egallaydi. */
      @media (pointer: coarse) { .ad { top: 22vh; height: min(38vh, 30vw); } }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <a class="ad" id="ad-left" target="_blank" rel="noopener noreferrer" tabindex="-1"></a>
    <a class="ad" id="ad-right" target="_blank" rel="noopener noreferrer" tabindex="-1"></a>
    <a id="privacy" href="privacy.html" target="_blank" rel="noopener" tabindex="-1">Privacy Policy</a>
    <div id="loading">
      <div id="title">TEPAGA!</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="message">Connecting...</div>
      <div id="hint"></div>
    </div>
    <button id="fullscreen" type="button" tabindex="-1">Fullscreen</button>
    <script src="banners.js"></script>
    <script>
      // banners.js bo'sh yoki xato bo'lsa ham o'yin ishlayveradi.
      for (const side of ["left", "right"]) {
        const box = document.querySelector("#ad-" + side);
        const ad = (window.TEPAGA_BANNERS || {})[side] || {};
        const label = ad.text || "YOUR AD HERE";
        if (ad.image) {
          const image = new Image();
          image.alt = label;
          image.onerror = () => { box.textContent = label; };
          image.src = ad.image;
          box.appendChild(image);
        } else {
          box.textContent = label;
        }
        if (/^https?:\/\//i.test(ad.link || "")) box.href = ad.link;
      }
      // O'yin chaqiradi: 0 - yashirin, 1 - ko'rinadi, 2 - bosiladi.
      window.tepagaAds = (mode) => {
        document.body.classList.toggle("ads-on", mode > 0);
        document.body.classList.toggle("ads-clickable", mode === 2);
      };

      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#loading");
      const fill = document.querySelector("#fill");
      const message = document.querySelector("#message");
      const fullscreen = document.querySelector("#fullscreen");

      // Juda katta (2K, 4K) ekranda videokarta ulgurmaydi: chiziladigan nuqtalar soni Full HD bilan cheklanadi.
      const maxPixels = 1920 * 1080;
      const pixelRatio = () =>
        Math.min(window.devicePixelRatio || 1, Math.sqrt(maxPixels / (window.innerWidth * window.innerHeight)));

      const config = {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: pixelRatio(),
      };

      const hint = document.querySelector("#hint");

      // Jami yuklanadigan hajm serverdan so'raladi, shunda yangi build'da ham to'g'ri chiqadi.
      // Aniqlab bo'lmasa 0 qoladi va MB o'rniga foiz ko'rsatiladi.
      let totalBytes = 0;
      Promise.all([config.dataUrl, config.frameworkUrl, config.codeUrl].map((url) =>
        fetch(url, { method: "HEAD" }).then((response) => (response.ok && Number(response.headers.get("content-length"))) || 0)
      )).then((sizes) => {
        if (sizes.every((size) => size > 0)) totalBytes = sizes.reduce((sum, size) => sum + size, 0);
        showDownload();
      }).catch(() => {});

      // Unity yuklab olishga progressning 0.9 qismini ajratadi (baytlar bo'yicha), qolgani - ochish va ishga tushirish.
      const downloadShare = 0.9;
      const slowAfter = 15000;
      let downloaded = 0;
      let lastChange = Date.now();
      let failed = false;

      function showDownload() {
        if (failed || downloaded <= 0 || downloaded >= 1) return;
        const megabytes = (bytes) => (bytes / 1e6).toFixed(1);
        message.textContent = totalBytes
          ? "Downloading... " + megabytes(downloaded * totalBytes) + " / " + megabytes(totalBytes) + " MB"
          : "Downloading... " + Math.floor(downloaded * 100) + "%";
      }

      function onProgress(progress) {
        fill.style.width = 100 * progress + "%";
        const fraction = Math.min(progress / downloadShare, 1);
        if (fraction === downloaded) return;
        downloaded = fraction;
        lastChange = Date.now();
        if (downloaded >= 1) {
          message.textContent = "Starting the game...";
          hint.textContent = "Download finished. This can take a while on slower devices.";
        } else {
          hint.textContent = "";
          showDownload();
        }
      }

      const slowCheck = setInterval(() => {
        if (downloaded < 1 && Date.now() - lastChange > slowAfter)
          hint.textContent = "Your connection seems slow or interrupted. If nothing changes, refresh the page.";
      }, 1000);

      function showError(text) {
        failed = true;
        clearInterval(slowCheck);
        hint.textContent = "";
        message.textContent = text;
      }

      const script = document.createElement("script");
      script.src = "Build/{{{ LOADER_FILENAME }}}";
      script.onload = () => {
        createUnityInstance(canvas, config, onProgress).then((game) => {
          clearInterval(slowCheck);
          loading.style.display = "none";
          fullscreen.style.display = "block";
          fullscreen.onclick = () => game.SetFullscreen(1);
          window.addEventListener("resize", () => { game.Module.devicePixelRatio = pixelRatio(); });
        }).catch((error) => {
          showError("The game could not start: " + error);
        });
      };
      script.onerror = () => showError("Could not load the game files. Please refresh the page.");
      document.body.appendChild(script);
    </script>
  </body>
</html>
